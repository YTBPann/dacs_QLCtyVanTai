<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo xe mới</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>

    <style>
        .form-page-main {
            min-height: calc(100vh - 72px);
            padding: 28px 20px 40px;
            background: #f4f7fb;
        }

        .vehicle-form-container {
            width: min(820px, 100%);
            margin: 0 auto;
        }

        .form-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 18px;
        }

        .form-page-title h1 {
            margin: 0 0 6px;
            color: #0f172a;
            font-size: 28px;
            line-height: 1.25;
        }

        .form-page-title p {
            margin: 0;
            color: #64748b;
            line-height: 1.5;
            max-width: 620px;
        }

        .form-page-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
        }

        .vehicle-form-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .vehicle-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .vehicle-form-grid .form-group {
            margin-bottom: 0;
        }

        .vehicle-form-grid .form-group.full-width {
            grid-column: 1 / -1;
        }

        .vehicle-form-grid label {
            display: block;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .vehicle-form-grid input,
        .vehicle-form-grid textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background: white;
            outline: none;
        }

        .vehicle-form-grid input:focus,
        .vehicle-form-grid textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .vehicle-form-grid textarea {
            min-height: 100px;
            resize: vertical;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-weight: 700;
            color: #334155;
        }

        .checkbox-row input {
            width: auto;
        }

        .text-muted {
            color: #64748b;
            font-size: 13px;
            line-height: 1.45;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            font-weight: 600;
        }

        .vehicle-form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        @media (max-width: 760px) {
            .form-page-main {
                padding: 20px 12px 32px;
            }

            .form-page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .form-page-actions {
                justify-content: flex-start;
            }

            .vehicle-form-grid {
                grid-template-columns: 1fr;
            }

            .vehicle-form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .vehicle-form-actions .btn,
            .form-page-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="form-page-main">
    <div class="vehicle-form-container">

        <div class="form-page-header">
            <div class="form-page-title">
                <h1>Tạo xe mới</h1>
                <p>
                    Thêm xe vào hệ thống để sử dụng trong phân công chuyến vận tải.
                </p>
            </div>

            <div class="form-page-actions">
                <a class="btn btn-secondary" th:href="@{/admin/vehicles}">
                    Về danh sách
                </a>
            </div>
        </div>

        <section class="vehicle-form-card">
            <form th:action="@{/admin/vehicles/create}"
                  th:object="${vehicleCreateRequest}"
                  method="post">

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="vehicle-form-grid">
                    <div class="form-group">
                        <label for="licensePlate">Biển số xe</label>
                        <input id="licensePlate"
                               type="text"
                               th:field="*{licensePlate}"
                               placeholder="VD: 51C-12345">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('licensePlate')}"
                             th:errors="*{licensePlate}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="vehicleType">Loại xe</label>
                        <input id="vehicleType"
                               type="text"
                               th:field="*{vehicleType}"
                               placeholder="VD: Xe tải, xe container, xe bán tải">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('vehicleType')}"
                             th:errors="*{vehicleType}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="capacity">Tải trọng</label>
                        <input id="capacity"
                               type="number"
                               step="0.01"
                               min="0"
                               th:field="*{capacity}"
                               placeholder="VD: 2.5">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('capacity')}"
                             th:errors="*{capacity}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-row">
                            <input type="checkbox" th:field="*{active}">
                            <span>Xe đang hoạt động</span>
                        </label>
                        <div class="text-muted">
                            Bỏ chọn nếu muốn tạo xe nhưng chưa cho xe hoạt động trong hệ thống.
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Ghi chú</label>
                        <textarea id="notes"
                                  th:field="*{notes}"
                                  placeholder="Ghi chú thêm nếu có"></textarea>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('notes')}"
                             th:errors="*{notes}">
                        </div>
                    </div>
                </div>

                <div class="vehicle-form-actions">
                    <button class="btn btn-primary" type="submit">
                        Lưu xe
                    </button>

                    <a class="btn btn-secondary" th:href="@{/admin/vehicles}">
                        Hủy
                    </a>
                </div>
            </form>
        </section>

    </div>
</main>

</body>
</html>
