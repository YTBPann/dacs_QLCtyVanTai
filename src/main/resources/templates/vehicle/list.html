<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách xe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        a,
        button {
            padding: 7px 12px;
            border-radius: 4px;
            border: 1px solid #777;
            background: #f3f4f6;
            color: #111827;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
            border-color: #f59e0b;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }

        .btn-success {
            background: #16a34a;
            color: white;
            border-color: #16a34a;
        }

        .btn-small {
            min-width: 58px;
            padding: 6px 10px;
            font-size: 13px;
        }

        .message {
            padding: 10px 12px;
            margin-bottom: 16px;
            border-radius: 4px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .vehicle-table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
        }

        .vehicle-table th,
        .vehicle-table td {
            border: 1px solid #999;
            padding: 8px 10px;
            vertical-align: middle;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .vehicle-table th {
            background: #f3f4f6;
            text-align: center;
        }

        .center {
            text-align: center;
        }

        .status-active {
            color: #15803d;
            font-weight: bold;
        }

        .status-inactive {
            color: #b91c1c;
            font-weight: bold;
        }

        .inline-form {
            display: inline;
            margin: 0;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 18px;
        }

        .note-cell {
            max-height: 70px;
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <h1>Danh sách xe</h1>

    <div class="actions">
        <a th:href="@{/dashboard}">Về dashboard</a>
        <a class="btn-primary" th:href="@{/admin/vehicles/create}">Tạo xe mới</a>
    </div>
</div>

<div th:if="${successMessage}" class="message success" th:text="${successMessage}"></div>

<table class="vehicle-table">
    <colgroup>
        <col style="width: 60px;">
        <col style="width: 150px;">
        <col style="width: 160px;">
        <col style="width: 110px;">
        <col style="width: 120px;">
        <col>
        <col style="width: 90px;">
        <col style="width: 80px;">
    </colgroup>

    <thead>
    <tr>
        <th>STT</th>
        <th>Biển số</th>
        <th>Loại xe</th>
        <th>Tải trọng</th>
        <th>Trạng thái</th>
        <th>Ghi chú</th>
        <th>Bật / tắt</th>
        <th>Sửa</th>
    </tr>
    </thead>

    <tbody>
    <tr th:if="${#lists.isEmpty(vehicles)}">
        <td colspan="8" class="empty">Chưa có xe nào.</td>
    </tr>

    <tr th:each="vehicle, stat : ${vehicles}">
        <td class="center" th:text="${stat.count}">1</td>

        <td th:text="${vehicle.licensePlate}">51C-12345</td>

        <td th:text="${vehicle.vehicleType}">Xe tải</td>

        <td class="center" th:text="${vehicle.capacity != null ? vehicle.capacity : '-'}">2.50</td>

        <td class="center">
            <span th:if="${vehicle.active}" class="status-active">Hoạt động</span>
            <span th:unless="${vehicle.active}" class="status-inactive">Tạm ngừng hoạt động</span>
        </td>

        <td>
            <div class="note-cell"
                 th:text="${vehicle.notes != null && !vehicle.notes.isBlank() ? vehicle.notes : '-'}">
                Ghi chú
            </div>
        </td>

        <td class="center">
            <form class="inline-form"
                  th:action="@{/admin/vehicles/{id}/toggle-active(id=${vehicle.id})}"
                  method="post">
                <button th:if="${vehicle.active}" class="btn-danger btn-small" type="submit">
                    Tắt
                </button>

                <button th:unless="${vehicle.active}" class="btn-success btn-small" type="submit">
                    Bật
                </button>
            </form>
        </td>

        <td class="center">
            <a class="btn-warning btn-small"
               th:href="@{/admin/vehicles/{id}/edit(id=${vehicle.id})}">
                Sửa
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
