<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="page-container">
    <section class="page-card">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">Quản lý người dùng</h1>
                <p class="page-desc">
                    Theo dõi tài khoản đăng nhập, vai trò và trạng thái hoạt động của người dùng trong hệ thống.
                </p>
            </div>

            <a class="btn-primary" th:href="@{/users/create}">
                Tạo user mới
            </a>
        </div>

        <div th:if="${successMessage}" class="success-message">
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="global-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="table-wrapper">
            <table class="app-table">
                <thead>
                <tr>
                    <th class="user-col-id text-center">ID</th>
                    <th class="user-col-username">Username</th>
                    <th class="user-col-fullname">Họ và tên</th>
                    <th class="user-col-role text-center">Role</th>
                    <th class="user-col-status text-center">Trạng thái</th>
                    <th class="user-col-action text-center">Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td class="user-col-id text-center" th:text="${user.id}"></td>
                    <td class="user-col-username" th:text="${user.username}"></td>
                    <td class="user-col-fullname" th:text="${user.fullName}"></td>
                    <td class="user-col-role text-center" th:text="${user.role}"></td>

                    <td class="user-col-status text-center">
                        <span th:if="${user.enabled}" class="status-badge status-active">
                            Đang hoạt động
                        </span>

                        <span th:if="${!user.enabled}" class="status-badge status-locked">
                            Đã bị khóa
                        </span>
                    </td>

                    <td class="user-col-action">
                        <div class="table-actions">
                            <span th:if="${user.role.name() == 'ADMIN'}"
                                  class="status-badge status-admin">
                                Không cho phép
                            </span>

                            <form th:if="${user.role.name() != 'ADMIN' and user.enabled}"
                                  th:action="@{/users/{id}/disable(id=${user.id})}"
                                  method="post">
                                <input type="hidden"
                                       th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <button type="submit" class="btn-small btn-danger">
                                    Tắt tài khoản
                                </button>
                            </form>

                            <form th:if="${user.role.name() != 'ADMIN' and !user.enabled}"
                                  th:action="@{/users/{id}/enable(id=${user.id})}"
                                  method="post">
                                <input type="hidden"
                                       th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}">
                                <button type="submit" class="btn-small btn-success">
                                    Bật tài khoản
                                </button>
                            </form>

                            <a th:href="@{/users/{id}/edit(id=${user.id})}"
                               class="btn-small btn-secondary">
                                Sửa
                            </a>
                        </div>
                    </td>
                </tr>

                <tr th:if="${users == null or users.isEmpty()}">
                    <td colspan="6" class="text-center text-muted">
                        Chưa có người dùng nào.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
