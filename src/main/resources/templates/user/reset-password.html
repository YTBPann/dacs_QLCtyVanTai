<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset mật khẩu user</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 520px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 4px;
        }

        .info-box {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 10px 12px;
            margin-bottom: 16px;
        }

        .actions {
            margin-top: 18px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<h1>Reset mật khẩu user</h1>

<div class="form-container">

    <div class="info-box">
        <div>
            <strong>ID:</strong>
            <span th:text="${user.id}">1</span>
        </div>
        <div>
            <strong>Username:</strong>
            <span th:text="${user.username}">username</span>
        </div>
        <div>
            <strong>Họ tên:</strong>
            <span th:text="${user.fullName}">Nguyễn Văn A</span>
        </div>
        <div>
            <strong>Role:</strong>
            <span th:text="${user.role}">DRIVER</span>
        </div>
    </div>

    <form th:action="@{/users/{id}/reset-password(id=${user.id})}"
          th:object="${resetPasswordRequest}"
          method="post">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
            <label for="newPassword">Mật khẩu mới</label>
            <input type="password"
                   id="newPassword"
                   th:field="*{newPassword}"
                   autocomplete="new-password">
            <div class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">
                Lỗi mật khẩu mới
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input type="password"
                   id="confirmPassword"
                   th:field="*{confirmPassword}"
                   autocomplete="new-password">
            <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">
                Lỗi nhập lại mật khẩu
            </div>
        </div>

        <div class="actions">
            <button type="submit">Reset mật khẩu</button>
            <a th:href="@{/users}">Quay lại danh sách user</a>
        </div>
    </form>

</div>

</body>
</html>
