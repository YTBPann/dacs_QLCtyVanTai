<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo tài khoản - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="page-container">
    <section class="page-card">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">Tạo tài khoản mới</h1>
                <p class="page-desc">
                    Tạo tài khoản đăng nhập cho quản lý hoặc tài xế.
                    Nếu chọn vai trò DRIVER, hệ thống sẽ yêu cầu thêm thông tin hồ sơ tài xế.
                </p>
            </div>

            <a class="btn-secondary" th:href="@{/users}">
                Quay lại danh sách
            </a>
        </div>

        <div th:if="${errorMessage != null}" class="global-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/users/create}" th:object="${userCreateRequest}" method="post">
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" th:field="*{username}">
                    <div class="error"
                         th:if="${#fields.hasErrors('username')}"
                         th:errors="*{username}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}">
                    <div class="error"
                         th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <input id="fullName" type="text" th:field="*{fullName}">
                    <div class="error"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="roleSelect">Vai trò</label>
                    <select th:field="*{role}" id="roleSelect">
                        <option value="">-- Chọn vai trò --</option>
                        <option th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${role}">
                        </option>
                    </select>
                    <div class="error"
                         th:if="${#fields.hasErrors('role')}"
                         th:errors="*{role}">
                    </div>
                </div>
            </div>

            <div id="driverFields" class="form-section" style="display:none;">
                <h2 class="form-section-title">Thông tin hồ sơ tài xế</h2>
                <p class="form-section-desc">
                    Phần này chỉ áp dụng khi tài khoản được tạo với vai trò DRIVER.
                </p>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="driverCode">Mã tài xế</label>
                        <input id="driverCode" type="text" th:field="*{driverCode}">
                        <div class="error"
                             th:if="${#fields.hasErrors('driverCode')}"
                             th:errors="*{driverCode}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Số điện thoại</label>
                        <input id="phoneNumber" type="text" th:field="*{phoneNumber}">
                        <div class="error"
                             th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Địa chỉ</label>
                        <textarea id="address" th:field="*{address}" rows="3"></textarea>
                        <div class="error"
                             th:if="${#fields.hasErrors('address')}"
                             th:errors="*{address}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="licenseNumber">Số GPLX</label>
                        <input id="licenseNumber" type="text" th:field="*{licenseNumber}">
                        <div class="error"
                             th:if="${#fields.hasErrors('licenseNumber')}"
                             th:errors="*{licenseNumber}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="licenseExpiryDate">Ngày hết hạn GPLX</label>
                        <input id="licenseExpiryDate" type="date" th:field="*{licenseExpiryDate}">
                        <div class="error"
                             th:if="${#fields.hasErrors('licenseExpiryDate')}"
                             th:errors="*{licenseExpiryDate}">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Ghi chú</label>
                        <textarea id="notes" th:field="*{notes}" rows="4"></textarea>
                        <div class="error"
                             th:if="${#fields.hasErrors('notes')}"
                             th:errors="*{notes}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit">
                    Tạo tài khoản
                </button>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>

<script>
    (function () {
        const roleSelect = document.getElementById("roleSelect");
        const driverFields = document.getElementById("driverFields");

        function toggleDriverFields() {
            if (!roleSelect || !driverFields) {
                return;
            }

            driverFields.style.display = roleSelect.value === "DRIVER" ? "block" : "none";
        }

        if (roleSelect) {
            roleSelect.addEventListener("change", toggleDriverFields);
            toggleDriverFields();
        }
    })();
</script>
</body>
</html>
