<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo tài xế - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="page-container">
    <section class="page-card">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">Tạo hồ sơ tài xế</h1>
                <p class="page-desc">
                    Tạo hồ sơ tài xế, thông tin giấy phép lái xe và liên kết với tài khoản DRIVER nếu có.
                </p>
            </div>

            <a class="btn-secondary" th:href="@{/admin/drivers}">
                Quay lại danh sách
            </a>
        </div>

        <div th:if="${errorMessage != null}" class="global-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/admin/drivers/create}" th:object="${driverCreateRequest}" method="post">
            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="driverCode">Mã tài xế</label>
                    <input type="text"
                           id="driverCode"
                           th:field="*{driverCode}"
                           placeholder="VD: TX001">
                    <div class="error"
                         th:if="${#fields.hasErrors('driverCode')}"
                         th:errors="*{driverCode}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullName">Họ tên</label>
                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           placeholder="Nguyễn Văn A">
                    <div class="error"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Số điện thoại</label>
                    <input type="text"
                           id="phoneNumber"
                           th:field="*{phoneNumber}"
                           placeholder="0901234567">
                    <div class="error"
                         th:if="${#fields.hasErrors('phoneNumber')}"
                         th:errors="*{phoneNumber}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="licenseNumber">Số GPLX</label>
                    <input type="text"
                           id="licenseNumber"
                           th:field="*{licenseNumber}"
                           placeholder="GPLX-001">
                    <div class="error"
                         th:if="${#fields.hasErrors('licenseNumber')}"
                         th:errors="*{licenseNumber}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="licenseExpiryDate">Ngày hết hạn GPLX</label>
                    <input type="date"
                           id="licenseExpiryDate"
                           th:field="*{licenseExpiryDate}">
                    <div class="error"
                         th:if="${#fields.hasErrors('licenseExpiryDate')}"
                         th:errors="*{licenseExpiryDate}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-row">
                        <input type="checkbox" th:field="*{active}">
                        Đang hoạt động
                    </label>
                    <div class="text-muted">
                        Bỏ chọn nếu muốn tạo hồ sơ nhưng chưa cho tài xế hoạt động trong hệ thống.
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="linkedUserAccountId">Tài khoản DRIVER liên kết</label>
                    <select id="linkedUserAccountId" th:field="*{linkedUserAccountId}">
                        <option value="">-- Chưa liên kết tài khoản --</option>
                        <option th:each="account : ${availableDriverAccounts}"
                                th:value="${account.id}"
                                th:text="${account.username + ' - ' + account.fullName}">
                        </option>
                    </select>

                    <div th:if="${#lists.isEmpty(availableDriverAccounts)}" class="text-muted" style="margin-top: 6px;">
                        Hiện chưa có tài khoản DRIVER khả dụng để liên kết.
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="address">Địa chỉ</label>
                    <textarea id="address"
                              th:field="*{address}"
                              rows="3"
                              placeholder="Nhập địa chỉ tài xế"></textarea>
                    <div class="error"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="notes">Ghi chú</label>
                    <textarea id="notes"
                              th:field="*{notes}"
                              rows="4"
                              placeholder="Ghi chú thêm nếu có"></textarea>
                    <div class="error"
                         th:if="${#fields.hasErrors('notes')}"
                         th:errors="*{notes}">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit">
                    Lưu tài xế
                </button>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
