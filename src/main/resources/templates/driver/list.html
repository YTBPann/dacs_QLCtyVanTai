<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách tài xế</title>
</head>
<body>
<h1>Danh sách tài xế</h1>

<div th:if="${successMessage != null}" style="color: green; margin-bottom: 12px;">
    <span th:text="${successMessage}"></span>
</div>

<div th:if="${errorMessage != null}" style="color: red; margin-bottom: 12px;">
    <span th:text="${errorMessage}"></span>
</div>

<p>
    <a th:href="@{/users/create}">Tạo user mới</a>
</p>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Mã tài xế</th>
        <th>Họ tên</th>
        <th>SĐT</th>
        <th>Số GPLX</th>
        <th>Hạn GPLX</th>
        <th>Tài khoản liên kết</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${#lists.isEmpty(drivers)}">
        <td colspan="9">Chưa có tài xế nào.</td>
    </tr>

    <tr th:each="driver : ${drivers}">
        <td th:text="${driver.id}"></td>
        <td th:text="${driver.driverCode}"></td>
        <td th:text="${driver.fullName}"></td>
        <td th:text="${driver.phoneNumber != null && !driver.phoneNumber.isBlank() ? driver.phoneNumber : '-'}"></td>
        <td th:text="${driver.licenseNumber}"></td>
        <td th:text="${driver.licenseExpiryDate != null ? driver.licenseExpiryDate : '-'}"></td>
        <td th:text="${driver.linkedUserAccount != null ? driver.linkedUserAccount.username : '-'}"></td>
        <td>
            <span th:if="${driver.linkedUserAccount == null}">Chưa liên kết tài khoản</span>
            <span th:if="${driver.linkedUserAccount != null}"
                  th:text="${driver.linkedUserAccount.enabled ? 'Đang hoạt động' : 'Tài khoản đã bị khóa'}"></span>
        </td>
        <td>
            <a th:href="@{/admin/drivers/{id}/edit(id=${driver.id})}">Sửa</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
