<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - Quản lý vận tải'">Cập nhật tài xế - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>

    <style>
        .form-page-main {
            min-height: calc(100vh - 72px);
            padding: 28px 20px 40px;
            background: #f4f7fb;
        }

        .driver-form-container {
            width: min(980px, 100%);
            margin: 0 auto;
        }

        .form-page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 18px;
        }

        .form-page-title h1 {
            margin: 0 0 6px;
            color: #0f172a;
            font-size: 28px;
            line-height: 1.25;
        }

        .form-page-title p {
            margin: 0;
            color: #64748b;
            line-height: 1.5;
            max-width: 760px;
        }

        .form-page-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            flex-shrink: 0;
        }

        .driver-form-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .driver-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .driver-form-grid .form-group {
            margin-bottom: 0;
        }

        .driver-form-grid .form-group.full-width {
            grid-column: 1 / -1;
        }

        .driver-form-grid label {
            display: block;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .driver-form-grid input,
        .driver-form-grid select,
        .driver-form-grid textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            background: white;
            outline: none;
        }

        .driver-form-grid input:focus,
        .driver-form-grid select:focus,
        .driver-form-grid textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .driver-form-grid textarea {
            resize: vertical;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            font-weight: 600;
        }

        .global-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .success-message {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .text-muted {
            color: #64748b;
            font-size: 13px;
            line-height: 1.45;
        }

        .driver-form-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        @media (max-width: 760px) {
            .form-page-main {
                padding: 20px 12px 32px;
            }

            .form-page-header {
                flex-direction: column;
                align-items: stretch;
            }

            .form-page-actions {
                justify-content: flex-start;
            }

            .driver-form-grid {
                grid-template-columns: 1fr;
            }

            .driver-form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .driver-form-actions .btn,
            .form-page-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="form-page-main">
    <div class="driver-form-container">

        <div class="form-page-header">
            <div class="form-page-title">
                <h1 th:text="${pageTitle}">Cập nhật tài xế</h1>
                <p>
                    Cập nhật thông tin hồ sơ tài xế. Trạng thái đăng nhập của tài xế được quản lý tại trang Quản lý người dùng.
                </p>
            </div>

            <div class="form-page-actions">
                <a class="btn btn-secondary" th:href="@{/admin/drivers}">
                    Về danh sách
                </a>
            </div>
        </div>

        <section class="driver-form-card">
            <div th:if="${successMessage}" class="success-message">
                <span th:text="${successMessage}"></span>
            </div>

            <div th:if="${errorMessage}" class="global-error">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/admin/drivers/{id}/edit(id=${driverId})}"
                  th:object="${driverUpdateRequest}"
                  method="post">

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <input type="hidden" th:field="*{active}">

                <div class="driver-form-grid">
                    <div class="form-group">
                        <label for="driverCode">Mã tài xế</label>
                        <input type="text" id="driverCode" th:field="*{driverCode}">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('driverCode')}"
                             th:errors="*{driverCode}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fullName">Họ tên</label>
                        <input type="text" id="fullName" th:field="*{fullName}">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('fullName')}"
                             th:errors="*{fullName}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Số điện thoại</label>
                        <input type="text" id="phoneNumber" th:field="*{phoneNumber}">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('phoneNumber')}"
                             th:errors="*{phoneNumber}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="licenseNumber">Số GPLX</label>
                        <input type="text" id="licenseNumber" th:field="*{licenseNumber}">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('licenseNumber')}"
                             th:errors="*{licenseNumber}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="licenseExpiryDate">Ngày hết hạn GPLX</label>
                        <input type="date" id="licenseExpiryDate" th:field="*{licenseExpiryDate}">
                        <div class="field-error"
                             th:if="${#fields.hasErrors('licenseExpiryDate')}"
                             th:errors="*{licenseExpiryDate}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="linkedUserAccountId">Tài khoản DRIVER liên kết</label>
                        <select id="linkedUserAccountId" th:field="*{linkedUserAccountId}">
                            <option th:value="''">-- Không liên kết tài khoản --</option>
                            <option th:each="account : ${availableDriverAccounts}"
                                    th:value="${account.id}"
                                    th:text="${account.username + ' - ' + account.fullName}">
                            </option>
                        </select>
                        <div class="text-muted" style="margin-top: 6px;">
                            Chỉ hiển thị các tài khoản DRIVER còn khả dụng hoặc tài khoản đang liên kết với hồ sơ này.
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Địa chỉ</label>
                        <textarea id="address" th:field="*{address}" rows="3"></textarea>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('address')}"
                             th:errors="*{address}">
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Ghi chú</label>
                        <textarea id="notes" th:field="*{notes}" rows="4"></textarea>
                        <div class="field-error"
                             th:if="${#fields.hasErrors('notes')}"
                             th:errors="*{notes}">
                        </div>
                    </div>
                </div>

                <div class="driver-form-actions">
                    <button class="btn btn-primary" type="submit">
                        Lưu cập nhật
                    </button>
                </div>
            </form>
        </section>

    </div>
</main>

</body>
</html>
