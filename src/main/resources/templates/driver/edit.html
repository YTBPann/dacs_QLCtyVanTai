<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle} + ' - Quản lý vận tải'">Cập nhật tài xế - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="page-container">
    <section class="page-card">
        <div class="page-header-row">
            <div>
                <h1 class="page-title" th:text="${pageTitle}">Cập nhật tài xế</h1>
                <p class="page-desc">
                    Cập nhật thông tin hồ sơ tài xế. Trạng thái đăng nhập của tài xế được quản lý tại trang Quản lý người dùng.
                </p>
            </div>

            <a class="btn-secondary" th:href="@{/admin/drivers}">
                Quay lại danh sách
            </a>
        </div>

        <div th:if="${successMessage}" class="success-message">
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="global-error">
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/admin/drivers/{id}/edit(id=${driverId})}"
              th:object="${driverUpdateRequest}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden" th:field="*{active}">

            <div class="form-grid">
                <div class="form-group">
                    <label for="driverCode">Mã tài xế</label>
                    <input type="text" id="driverCode" th:field="*{driverCode}">
                    <div class="error"
                         th:if="${#fields.hasErrors('driverCode')}"
                         th:errors="*{driverCode}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="fullName">Họ tên</label>
                    <input type="text" id="fullName" th:field="*{fullName}">
                    <div class="error"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Số điện thoại</label>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}">
                    <div class="error"
                         th:if="${#fields.hasErrors('phoneNumber')}"
                         th:errors="*{phoneNumber}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="licenseNumber">Số GPLX</label>
                    <input type="text" id="licenseNumber" th:field="*{licenseNumber}">
                    <div class="error"
                         th:if="${#fields.hasErrors('licenseNumber')}"
                         th:errors="*{licenseNumber}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="licenseExpiryDate">Ngày hết hạn GPLX</label>
                    <input type="date" id="licenseExpiryDate" th:field="*{licenseExpiryDate}">
                    <div class="error"
                         th:if="${#fields.hasErrors('licenseExpiryDate')}"
                         th:errors="*{licenseExpiryDate}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="linkedUserAccountId">Tài khoản DRIVER liên kết</label>
                    <select id="linkedUserAccountId" th:field="*{linkedUserAccountId}">
                        <option th:value="''">-- Không liên kết tài khoản --</option>
                        <option th:each="account : ${availableDriverAccounts}"
                                th:value="${account.id}"
                                th:text="${account.username + ' - ' + account.fullName}">
                        </option>
                    </select>
                    <div class="text-muted" style="margin-top: 6px;">
                        Chỉ hiển thị các tài khoản DRIVER còn khả dụng hoặc tài khoản đang liên kết với hồ sơ này.
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="address">Địa chỉ</label>
                    <textarea id="address" th:field="*{address}" rows="3"></textarea>
                    <div class="error"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="notes">Ghi chú</label>
                    <textarea id="notes" th:field="*{notes}" rows="4"></textarea>
                    <div class="error"
                         th:if="${#fields.hasErrors('notes')}"
                         th:errors="*{notes}">
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit">
                    Lưu cập nhật
                </button>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
