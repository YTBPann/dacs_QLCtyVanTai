<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="password"] {
            width: 100%;
            max-width: 420px;
            padding: 8px 10px;
            border: 1px solid #999;
            border-radius: 4px;
        }

        .error {
            color: #dc2626;
            margin-top: 6px;
            font-size: 14px;
        }

        .global-error {
            color: #dc2626;
            background: #fee2e2;
            border: 1px solid #fca5a5;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 14px;
            max-width: 520px;
        }

        .actions {
            margin-top: 18px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>

<h1>Đổi mật khẩu</h1>

<form th:action="@{/account/change-password}" th:object="${request}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
        <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
    </div>

    <div class="form-group">
        <label for="currentPassword">Mật khẩu hiện tại</label>
        <input id="currentPassword"
               type="password"
               th:field="*{currentPassword}"
               autocomplete="current-password">
        <div class="error"
             th:if="${#fields.hasErrors('currentPassword')}"
             th:errors="*{currentPassword}">
        </div>
    </div>

    <div class="form-group">
        <label for="newPassword">Mật khẩu mới</label>
        <input id="newPassword"
               type="password"
               th:field="*{newPassword}"
               autocomplete="new-password">
        <div class="error"
             th:if="${#fields.hasErrors('newPassword')}"
             th:errors="*{newPassword}">
        </div>
    </div>

    <div class="form-group">
        <label for="confirmNewPassword">Nhập lại mật khẩu mới</label>
        <input id="confirmNewPassword"
               type="password"
               th:field="*{confirmNewPassword}"
               autocomplete="new-password">
        <div class="error"
             th:if="${#fields.hasErrors('confirmNewPassword')}"
             th:errors="*{confirmNewPassword}">
        </div>
    </div>

    <div class="actions">
        <button type="submit">Đổi mật khẩu</button>
        <a th:href="@{/dashboard}">Quay lại dashboard</a>
    </div>
</form>

</body>
</html>
