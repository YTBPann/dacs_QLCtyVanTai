<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="page-container narrow">
    <section class="page-card">
        <h1 class="page-title">Đổi mật khẩu</h1>
        <p class="page-desc">
            Nhập mật khẩu hiện tại và mật khẩu mới để cập nhật thông tin đăng nhập của tài khoản.
        </p>

        <form th:action="@{/account/change-password}" th:object="${request}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${#fields.hasGlobalErrors()}" class="global-error">
                <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
            </div>

            <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <input id="currentPassword"
                       type="password"
                       th:field="*{currentPassword}"
                       autocomplete="current-password">
                <div class="error"
                     th:if="${#fields.hasErrors('currentPassword')}"
                     th:errors="*{currentPassword}">
                </div>
            </div>

            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword"
                       type="password"
                       th:field="*{newPassword}"
                       autocomplete="new-password">
                <div class="error"
                     th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Nhập lại mật khẩu mới</label>
                <input id="confirmNewPassword"
                       type="password"
                       th:field="*{confirmNewPassword}"
                       autocomplete="new-password">
                <div class="error"
                     th:if="${#fields.hasErrors('confirmNewPassword')}"
                     th:errors="*{confirmNewPassword}">
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit">
                    Đổi mật khẩu
                </button>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
