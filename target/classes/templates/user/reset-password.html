<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset mật khẩu - Quản lý vận tải</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="page-container narrow">
    <section class="page-card">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">Reset mật khẩu user</h1>
                <p class="page-desc">
                    Đặt lại mật khẩu đăng nhập cho tài khoản người dùng được chọn.
                </p>
            </div>

            <a class="btn-secondary" th:href="@{/users}">
                Quay lại danh sách
            </a>
        </div>

        <div class="user-summary" th:if="${user != null}">
            <div>
                <strong>ID:</strong>
                <span th:text="${user.id}">1</span>
            </div>

            <div>
                <strong>Username:</strong>
                <span th:text="${user.username}">username</span>
            </div>

            <div>
                <strong>Họ tên:</strong>
                <span th:text="${user.fullName}">Nguyễn Văn A</span>
            </div>

            <div>
                <strong>Role:</strong>
                <span th:text="${user.role}">DRIVER</span>
            </div>
        </div>

        <form th:action="@{/users/{id}/reset-password(id=${user.id})}"
              th:object="${resetPasswordRequest}"
              method="post">

            <input type="hidden"
                   th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <input type="password"
                       id="newPassword"
                       th:field="*{newPassword}"
                       autocomplete="new-password">
                <div class="error"
                     th:if="${#fields.hasErrors('newPassword')}"
                     th:errors="*{newPassword}">
                    Lỗi mật khẩu mới
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Nhập lại mật khẩu mới</label>
                <input type="password"
                       id="confirmPassword"
                       th:field="*{confirmPassword}"
                       autocomplete="new-password">
                <div class="error"
                     th:if="${#fields.hasErrors('confirmPassword')}"
                     th:errors="*{confirmPassword}">
                    Lỗi nhập lại mật khẩu
                </div>
            </div>

            <div class="actions">
                <button class="btn-primary" type="submit">
                    Reset mật khẩu
                </button>
            </div>
        </form>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
