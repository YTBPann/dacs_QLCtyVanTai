<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa xe</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="app-main">
    <div class="app-container app-container-narrow">

        <div class="page-header">
            <div>
                <h1>Sửa xe</h1>
                <p>Cập nhật thông tin xe, tải trọng, trạng thái hoạt động và ghi chú.</p>
            </div>

            <div class="page-actions">
                <a class="btn btn-secondary" th:href="@{/admin/vehicles}">Quay lại</a>
            </div>
        </div>

        <section class="card">
            <form th:action="@{/admin/vehicles/{id}/edit(id=${vehicleId})}"
                  th:object="${vehicleUpdateRequest}"
                  method="post"
                  class="app-form">

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="licensePlate">Biển số xe</label>
                    <input id="licensePlate"
                           type="text"
                           th:field="*{licensePlate}">
                    <div class="field-error"
                         th:if="${#fields.hasErrors('licensePlate')}"
                         th:errors="*{licensePlate}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="vehicleType">Loại xe</label>
                    <input id="vehicleType"
                           type="text"
                           th:field="*{vehicleType}">
                    <div class="field-error"
                         th:if="${#fields.hasErrors('vehicleType')}"
                         th:errors="*{vehicleType}">
                    </div>
                </div>

                <div class="form-group">
                    <label for="capacity">Tải trọng</label>
                    <input id="capacity"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{capacity}">
                    <div class="field-error"
                         th:if="${#fields.hasErrors('capacity')}"
                         th:errors="*{capacity}">
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-row">
                        <input type="checkbox" th:field="*{active}">
                        <span>Xe đang hoạt động</span>
                    </label>
                </div>

                <div class="form-group">
                    <label for="notes">Ghi chú</label>
                    <textarea id="notes" th:field="*{notes}"></textarea>
                    <div class="field-error"
                         th:if="${#fields.hasErrors('notes')}"
                         th:errors="*{notes}">
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Lưu thay đổi</button>
                    <a class="btn btn-secondary" th:href="@{/admin/vehicles}">Quay lại</a>
                </div>

            </form>
        </section>

    </div>
</main>

</body>
</html>
