<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách xe</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>

<div th:replace="~{fragments/app-header :: appHeader}"></div>

<main class="app-main">
    <div class="app-container">

        <div class="page-header">
            <div>
                <h1>Danh sách xe</h1>
                <p>Quản lý xe vận tải, trạng thái hoạt động và thông tin ghi chú.</p>
            </div>

            <div class="page-actions">
                <a class="btn btn-primary" th:href="@{/admin/vehicles/create}">
                    + Tạo xe
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <section class="card">
            <div class="table-wrapper">
                <table class="app-table vehicle-table">
                    <colgroup>
                        <col class="col-stt">
                        <col class="col-license-plate">
                        <col class="col-vehicle-type">
                        <col class="col-capacity">
                        <col class="col-status">
                        <col class="col-notes">
                        <col class="col-actions">
                    </colgroup>

                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>Biển số</th>
                        <th>Loại xe</th>
                        <th>Tải trọng</th>
                        <th>Trạng thái</th>
                        <th>Ghi chú</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(vehicles)}">
                        <td colspan="7" class="empty-cell">Chưa có xe nào.</td>
                    </tr>

                    <tr th:each="vehicle, stat : ${vehicles}">
                        <td class="text-center" th:text="${stat.count}">1</td>

                        <td>
                            <strong th:text="${vehicle.licensePlate}">51C-12345</strong>
                        </td>

                        <td th:text="${vehicle.vehicleType}">Xe tải</td>

                        <td class="text-center" th:text="${vehicle.capacity != null ? vehicle.capacity : '-'}">
                            2.50
                        </td>

                        <td class="text-center">
                            <span th:if="${vehicle.active}" class="badge badge-success">Hoạt động</span>
                            <span th:unless="${vehicle.active}" class="badge badge-danger">Tạm ngừng</span>
                        </td>

                        <td>
                            <div class="note-cell"
                                 th:text="${vehicle.notes != null && !vehicle.notes.isBlank() ? vehicle.notes : '-'}">
                                Ghi chú
                            </div>
                        </td>

                        <td>
                            <div class="table-actions">
                                <form class="inline-form"
                                      th:action="@{/admin/vehicles/{id}/toggle-active(id=${vehicle.id})}"
                                      method="post">
                                    <input type="hidden"
                                           th:if="${_csrf != null}"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button th:if="${vehicle.active}" class="btn btn-danger btn-sm" type="submit">
                                        Tắt
                                    </button>

                                    <button th:unless="${vehicle.active}" class="btn btn-success btn-sm" type="submit">
                                        Bật
                                    </button>
                                </form>

                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/admin/vehicles/{id}/edit(id=${vehicle.id})}">
                                    Sửa
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>
</main>

</body>
</html>
