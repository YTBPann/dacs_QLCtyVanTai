<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo xe mới</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 24px auto;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            max-width: 460px;
            padding: 8px 10px;
            border: 1px solid #999;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        a,
        button {
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid #777;
            background: #f3f4f6;
            color: #111827;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
    </style>
</head>
<body>

<h1>Tạo xe mới</h1>

<form th:action="@{/admin/vehicles/create}"
      th:object="${vehicleCreateRequest}"
      method="post">

    <div class="form-group">
        <label for="licensePlate">Biển số xe</label>
        <input id="licensePlate" type="text" th:field="*{licensePlate}" placeholder="VD: 51C-12345">
        <div class="error" th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}"></div>
    </div>

    <div class="form-group">
        <label for="vehicleType">Loại xe</label>
        <input id="vehicleType" type="text" th:field="*{vehicleType}" placeholder="VD: Xe tải, xe container, xe bán tải">
        <div class="error" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}"></div>
    </div>

    <div class="form-group">
        <label for="capacity">Tải trọng</label>
        <input id="capacity" type="number" step="0.01" min="0" th:field="*{capacity}" placeholder="VD: 2.5">
        <div class="error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" th:field="*{active}">
            Xe đang hoạt động
        </label>
    </div>

    <div class="form-group">
        <label for="notes">Ghi chú</label>
        <textarea id="notes" th:field="*{notes}" placeholder="Ghi chú thêm nếu có"></textarea>
        <div class="error" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
    </div>

    <div class="actions">
        <button class="btn-primary" type="submit">Lưu</button>
        <a th:href="@{/admin/vehicles}">Quay lại</a>
    </div>

</form>

</body>
</html>
