<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="app-header" th:fragment="appHeader">
    <div class="header-left">
        <a class="home-link" th:href="@{/dashboard}">
            <span class="home-icon">🏠</span>
        </a>
    </div>

    <div class="header-right">
        <div class="header-menu"
             th:if="${role != null and (role.toString() == 'ADMIN' or role.toString() == 'MANAGER')}">
            <button class="circle-btn" type="button" data-menu-button="managementMenu" title="Quản lý">
                ▦
            </button>

            <div class="dropdown-panel" id="managementMenu">
                <div class="dropdown-title">Quản lý hệ thống</div>

                <a class="dropdown-item"
                   th:if="${role != null and role.toString() == 'ADMIN'}"
                   th:href="@{/users}">
                    👥 Quản lý tài khoản người dùng
                </a>

                <a class="dropdown-item" th:href="@{/admin/drivers}">
                    🪪 Quản lý hồ sơ tài xế
                </a>

                <a class="dropdown-item" th:href="@{/admin/vehicles}">
                    🚚 Quản lý xe
                </a>

                <a class="dropdown-item" th:href="@{/admin/trips}">
                    📦 Quản lý chuyến
                </a>

                <a class="dropdown-item" th:href="@{/admin/locations}">
                    📍 Quản lý địa điểm
                </a>
            </div>
        </div>

        <div class="header-menu">
            <button class="circle-btn" type="button" data-menu-button="profileMenu" title="Tài khoản">
                👤
            </button>

            <div class="dropdown-panel" id="profileMenu">
                <div class="dropdown-user">
                    <div class="dropdown-user-name" th:text="${fullName}">System Administrator</div>

                    <div class="dropdown-user-meta">
                        Tên đăng nhập:
                        <b th:text="${username}">admin</b>
                    </div>

                    <div class="dropdown-user-meta">
                        Vai trò:
                        <b th:text="${role}">ADMIN</b>
                    </div>
                </div>

                <a class="dropdown-item" th:href="@{/account/change-password}">
                    🔐 Đổi mật khẩu
                </a>

                <form class="dropdown-form" th:action="@{/logout}" method="post">
                    <button class="dropdown-submit danger" type="submit">
                        🚪 Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>
</body>
</html>
